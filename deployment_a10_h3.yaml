apiVersion: apps/v1
kind: Deployment
metadata:
  name: zimo-deployment-h3-a10
  labels:
    app: zimo-deployment-h3-a10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zimo-deployment-h3-a10
  template:
    metadata:
      labels:
        app: zimo-deployment-h3-a10
    spec:
      restartPolicy: Always

      # ✅ 只调度到 A10 节点（排除之前出过问题的节点）
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - gpu-09.nrp.mghpcc.org
                      - hcc-nrp-shor-c6017.unl.edu

      containers:
        - name: h3-container
          image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
          imagePullPolicy: IfNotPresent
          # H3 int8 权重常驻 CPU 内存（加载时 bf16 权重 mmap 进来，峰值远高于 int8 的 ~62GB）
          resources:
            limits:
              memory: 160Gi
              cpu: 16000m
              nvidia.com/gpu: 1
              ephemeral-storage: "50Gi"
            requests:
              memory: 160Gi
              cpu: 16000m
              nvidia.com/gpu: 1
              ephemeral-storage: "50Gi"
          env:
            - name: HF_HOME
              value: /pv/h3/hf_cache
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "=== H3 A10 container ==="
              nvidia-smi || echo "GPU not detected"
              apt-get update -qq && apt-get install -y -qq git ffmpeg > /dev/null
              # 版本固定为 A10 上实测跑通的组合；torchao 0.18 需要 torch >= 2.11
              pip install -q torch==2.14.0 torchvision==0.29.0 torchaudio==2.11.0
              pip install -q \
                "git+https://github.com/huggingface/diffusers.git@e0abab83b5df05de9e7abd788643c1a7c1e42e28" \
                transformers==5.17.0 accelerate==1.15.0 peft==0.21.0 torchao==0.18.0 \
                safetensors==0.8.0 av==18.1.0 huggingface_hub==1.33.0 pillow numpy
              echo "=== deps ready, starting worker ==="
              # worker 常驻并轮询 /pv/h3/queue；进程退出会让容器退出，由 k8s 自动重启
              cd /pv/h3
              python run_a10.py \
                --transformer-path /pv/h3/weights/pdmd_zwang000_s3500 \
                --inference-steps 4 --video-shift 12 --audio-shift 3 \
                2>&1 | tee -a /pv/h3/run.log
          volumeMounts:
            - mountPath: /pv
              name: zmw-vol-haosu
            - mountPath: /dev/shm
              name: dshm

      volumes:
        - name: zmw-vol-haosu
          persistentVolumeClaim:
            claimName: zmw-vol-haosu

        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
