apiVersion: apps/v1
kind: Deployment
metadata:
  name: zimo-deployment-h3-cpu
  labels:
    app: zimo-deployment-h3-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zimo-deployment-h3-cpu
  template:
    metadata:
      labels:
        app: zimo-deployment-h3-cpu
    spec:
      restartPolicy: Always
      containers:
        # CPU-only pod for browsing and copying files on the PVC; no GPU requested
        - name: h3-cpu
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: 4Gi
              cpu: 1000m
              ephemeral-storage: "10Gi"
            requests:
              memory: 4Gi
              cpu: 1000m
              ephemeral-storage: "10Gi"
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "=== H3 CPU file-access pod ==="
              sleep infinity
          volumeMounts:
            - mountPath: /pv
              name: zmw-vol-haosu
      volumes:
        - name: zmw-vol-haosu
          persistentVolumeClaim:
            claimName: zmw-vol-haosu
