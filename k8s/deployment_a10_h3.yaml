apiVersion: apps/v1
kind: Deployment
metadata:
  name: zimo-deployment-h3-a10
  labels:
    app: zimo-deployment-h3-a10
spec:
  replicas: 1
  # A rolling update would need a second A10 while the old pod still holds one; free it first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zimo-deployment-h3-a10
  template:
    metadata:
      labels:
        app: zimo-deployment-h3-a10
    spec:
      restartPolicy: Always

      # Schedule on A10 nodes only, skipping nodes that caused problems before
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - gpu-09.nrp.mghpcc.org
                      - hcc-nrp-shor-c6017.unl.edu

      containers:
        - name: h3-container
          image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
          imagePullPolicy: IfNotPresent
          # The int8 H3 weights stay in host RAM; loading mmaps the bf16 weights, so the peak is far above the ~62GB int8 footprint
          resources:
            limits:
              memory: 128Gi
              cpu: 8000m
              nvidia.com/gpu: 1
              ephemeral-storage: "30Gi"
            requests:
              memory: 128Gi
              cpu: 8000m
              nvidia.com/gpu: 1
              ephemeral-storage: "30Gi"
          env:
            - name: HF_HOME
              value: /pv/h3/hf_cache
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "=== H3 A10 container ==="
              nvidia-smi || echo "GPU not detected"
              apt-get update -qq && apt-get install -y -qq git ffmpeg > /dev/null
              # Versions pinned to the combination verified on the A10; torchao 0.18 needs torch >= 2.11
              pip install -q torch==2.14.0 torchvision==0.29.0 torchaudio==2.11.0
              pip install -q \
                "git+https://github.com/huggingface/diffusers.git@e0abab83b5df05de9e7abd788643c1a7c1e42e28" \
                transformers==5.17.0 accelerate==1.15.0 peft==0.21.0 torchao==0.18.0 \
                safetensors==0.8.0 av==18.1.0 huggingface_hub==1.33.0 pillow numpy
              echo "=== deps ready, starting worker ==="
              # The worker stays up polling /pv/h3/queue; if it exits, the container exits and k8s restarts it.
              # Worker arguments come from /pv/h3/serve_args, so switching the served model only needs
              # an edit of that file and a worker restart.
              # The worker script comes from the h3-scripts ConfigMap (tools/upload_scripts.sh).
              cd /pv/h3
              test -f serve_args || echo "--transformer-path /pv/h3/ckpt/pdmd_4NFE_full --inference-steps 4" > serve_args
              echo "serve_args: $(cat serve_args)"
              python /opt/h3/run_a10.py $(cat serve_args) 2>&1 | tee -a /pv/h3/run.log
          volumeMounts:
            - mountPath: /pv
              name: zmw-vol-haosu
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /opt/h3
              name: h3-scripts

      volumes:
        - name: zmw-vol-haosu
          persistentVolumeClaim:
            claimName: zmw-vol-haosu

        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

        - name: h3-scripts
          configMap:
            name: h3-scripts
