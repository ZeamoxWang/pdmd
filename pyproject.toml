[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projected-dmd-training"
version = "0.1.0"
description = "Projected DMD training for MiniMax-H3"
requires-python = ">=3.10"
dependencies = ["torch>=2.8", "safetensors>=0.6", "numpy", "huggingface-hub>=0.34"]

[tool.setuptools.packages.find]
include = ["pdmd_training*"]
